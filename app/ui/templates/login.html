<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — {{ server_name }}</title>
    <!-- Bootswatch Zephyr (Modern Light Theme) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/zephyr/bootstrap.min.css">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/pream.css">
    <style>
        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            border-radius: 1rem;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body>
    <div class="login-card p-4 p-sm-5">
        <!-- Logo and Brand Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle shadow-sm mb-3" style="width: 60px; height: 60px;">
                <i class="fa-solid fa-satellite-dish fs-3"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1 tracking-wide">{{ server_name }}</h3>
            <p class="text-secondary fs-7 mb-0">Sign in to access your IPTV Management Gateway</p>
        </div>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center p-3 mb-4 rounded-3 shadow-sm border border-danger-subtle" role="alert">
            <i class="fa-solid fa-triangle-exclamation fs-5 me-2 flex-shrink-0 text-danger"></i>
            <div class="fs-7">
                <strong>Invalid credentials.</strong> Please verify the username and password from your <code>.env</code> file.
            </div>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="/login">
            <input type="hidden" name="next" value="{{ next_url or '/' }}">

            <div class="mb-3">
                <label for="adminUsername" class="form-label text-dark fw-semibold fs-7">Admin Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control border-start-0" id="adminUsername" name="username" 
                           placeholder="admin" value="{{ default_username or 'admin' }}" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="adminPassword" class="form-label text-dark fw-semibold fs-7">Admin Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="adminPassword" name="password" 
                           placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility()">
                        <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 shadow-sm">
                <span>Sign In to Dashboard</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- Default Credentials Helper Banner -->
        <div class="mt-4 pt-3 border-top text-center">
            <div class="p-2 rounded bg-light border d-inline-block text-start w-100">
                <div class="d-flex align-items-start gap-2">
                    <i class="fa-solid fa-circle-info text-primary mt-1"></i>
                    <div class="fs-8 text-secondary">
                        <strong class="text-dark">Default Credentials:</strong><br>
                        Username: <code class="fw-bold">admin</code> &bull; Password: <code class="fw-bold">pream</code><br>
                        <span class="text-muted">Configured via <code>ADMIN_USERNAME</code> and <code>ADMIN_PASSWORD</code> in <code>.env</code></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('adminPassword');
            const icon = document.getElementById('togglePasswordIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
