services:
  pream:
    build: .
    image: pream:latest
    container_name: pream
    restart: unless-stopped
    ports:
      - "8055:8000"
    volumes:
      - ./data:/app/data:Z
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
