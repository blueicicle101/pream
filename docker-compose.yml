services:
  pream:
    build: .
    image: pream:latest
    container_name: pream
    restart: unless-stopped
    ports:
      - "8055:8055"
    volumes:
      - ./data:/app/data:Z
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 2m
      timeout: 15s
      retries: 3
      start_period: 20s
