services:
  pream:
    build: .
    image: pream:latest
    container_name: pream
    restart: unless-stopped
    # ports:
    #   - "8000:8000"
    network_mode: host
    volumes:
      - ./data:/app/data:Z
    env_file:
      - path: .env
        required: false
    deploy:
      resources:
        limits:
          cpus: '${PREAM_CPU_LIMIT:-2.0}'
          memory: '${PREAM_MEMORY_LIMIT:-2048M}'
        reservations:
          cpus: '${PREAM_CPU_RESERVATION:-0.5}'
          memory: '${PREAM_MEMORY_RESERVATION:-512M}'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 2m
      timeout: 15s
      retries: 3
      start_period: 20s
